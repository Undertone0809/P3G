name: refresh dependencies

on:
  push:
    branches:
      - chore/update-dependencies-2026-07
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'chore/update-dependencies-2026-07' || github.ref_name == 'chore/update-dependencies-2026-07')
    runs-on: ubuntu-latest

    steps:
      - name: Check out dependency branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependency tooling
        run: python -m pip install --upgrade pip 'poetry==1.8.5' packaging

      - name: Refresh Python dependency constraints
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          from packaging.specifiers import InvalidSpecifier, SpecifierSet
          from packaging.version import InvalidVersion, Version

          PYTHON_VERSION = Version('3.8.0')
          ROOT_PACKAGES = [
              'cookiecutter',
              'bandit',
              'darglint',
              'pre-commit',
              'pydocstyle',
              'safety',
              'pytest',
              'pytest-html',
              'pytest-cov',
              'coverage',
              'coverage-badge',
              'ruff',
          ]
          TEMPLATE_PACKAGES = [
              'typer',
              'rich',
              'pytest',
              'pytest-html',
              'pytest-cov',
              'bandit',
              'ruff',
              'pre-commit',
              'coverage',
              'coverage-badge',
              'safety',
              'darglint',
          ]
          TEMPLATE_PYPROJECT = Path(
              "{{ cookiecutter.project_name.lower().replace(' ', '_').replace('-', '_') }}/pyproject.toml"
          )

          def supports_python_38(requires_python: str | None) -> bool:
              if not requires_python:
                  return True
              try:
                  return SpecifierSet(requires_python).contains(
                      PYTHON_VERSION, prereleases=True
                  )
              except InvalidSpecifier:
                  return False

          def latest_compatible(package: str) -> str:
              request = Request(
                  f'https://pypi.org/pypi/{quote(package)}/json',
                  headers={'User-Agent': 'P3G dependency refresh'},
              )
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              candidates: list[Version] = []
              for raw_version, files in payload['releases'].items():
                  try:
                      version = Version(raw_version)
                  except InvalidVersion:
                      continue
                  if version.is_prerelease or version.is_devrelease or not files:
                      continue
                  if any(
                      not file.get('yanked', False)
                      and supports_python_38(file.get('requires_python'))
                      for file in files
                  ):
                      candidates.append(version)

              if not candidates:
                  raise RuntimeError(
                      f'No stable Python 3.8-compatible release found for {package}'
                  )
              return str(max(candidates))

          def update_assignment(text: str, package: str, version: str) -> str:
              table_pattern = re.compile(
                  rf'({re.escape(package)}\s*=\s*\{{[^\n]*?\bversion\s*=\s*")\^[^"]+(")'
              )
              direct_pattern = re.compile(
                  rf'({re.escape(package)}\s*=\s*")\^[^"]+(")'
              )
              if table_pattern.search(text):
                  return table_pattern.sub(rf'\g<1>^{version}\g<2>', text)
              if direct_pattern.search(text):
                  return direct_pattern.sub(rf'\g<1>^{version}\g<2>', text)
              raise RuntimeError(f'Could not find dependency assignment for {package}')

          versions = {
              package: latest_compatible(package)
              for package in sorted(set(ROOT_PACKAGES + TEMPLATE_PACKAGES))
          }
          poetry_core_version = latest_compatible('poetry-core')

          root_path = Path('pyproject.toml')
          root_text = root_path.read_text()
          for package in ROOT_PACKAGES:
              root_text = update_assignment(root_text, package, versions[package])
          root_text = re.sub(
              r'poetry_core>=\d+(?:\.\d+)*',
              f'poetry_core>={poetry_core_version}',
              root_text,
          )
          root_path.write_text(root_text)

          template_text = TEMPLATE_PYPROJECT.read_text()
          for package in TEMPLATE_PACKAGES:
              template_text = update_assignment(
                  template_text, package, versions[package]
              )
          template_text = re.sub(
              r'poetry_core>=\d+(?:\.\d+)*',
              f'poetry_core>={poetry_core_version}',
              template_text,
          )
          template_text = re.sub(
              r'typer\s*=\s*\{extras\s*=\s*\["all"\],\s*version\s*=\s*"(\^[^"]+)"\}',
              r'typer = "\1"',
              template_text,
          )
          TEMPLATE_PYPROJECT.write_text(template_text)

          print('Selected Python dependency versions:')
          for package in sorted(versions):
              print(f'  {package}: {versions[package]}')
          print(f'  poetry-core: {poetry_core_version}')
          PY

          poetry lock -n

      - name: Refresh documentation dependencies
        shell: bash
        run: |
          pnpm --dir docs update --latest

          python - <<'PY'
          import json
          from pathlib import Path

          root_path = Path('docs/package.json')
          template_path = Path(
              "{{ cookiecutter.project_name.lower().replace(' ', '_').replace('-', '_') }}/docs/package.json"
          )
          root = json.loads(root_path.read_text())
          template = json.loads(template_path.read_text())

          root_versions = {}
          for section in ('dependencies', 'devDependencies'):
              root_versions.update(root.get(section, {}))

          for section in ('dependencies', 'devDependencies'):
              for package in template.get(section, {}):
                  if package in root_versions:
                      template[section][package] = root_versions[package]

          template_path.write_text(json.dumps(template, indent=2) + '\n')
          PY

      - name: Install and test P3G
        shell: bash
        run: |
          poetry config virtualenvs.in-project true
          poetry install -n
          poetry check
          make check-codestyle
          PYTHONPATH="$(pwd)" poetry run pytest -c pyproject.toml --cov-report=term --cov=hooks tests/
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs docs:build

      - name: Smoke-test a generated project
        shell: bash
        run: |
          rm -rf /tmp/p3g-smoke
          poetry run cookiecutter . --no-input --output-dir /tmp/p3g-smoke
          cd /tmp/p3g-smoke/python_project
          poetry config virtualenvs.in-project true
          poetry lock -n
          poetry install -n
          make check-codestyle
          make test
          pnpm --dir docs install --no-frozen-lockfile
          pnpm --dir docs docs:build

      - name: Commit refreshed dependency files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-dependencies.yml
          git add -u
          git status --short
          git commit -m 'chore: update dependencies'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
